<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tg" x1="7" y1="7" x2="57" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset=".5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main logo background -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="17"
    fill="#08080C"
    stroke="url(#tg)"
    stroke-width="2.5"
  />

  <!-- Inner gradient glow -->
  <rect
    x="10"
    y="10"
    width="44"
    height="44"
    rx="13"
    fill="url(#tg)"
    opacity=".10"
  />

  <!-- T -->
  <path
    d="M13 18h22v6h-8v22h-6V24h-8v-6Z"
    fill="url(#tg)"
    filter="url(#glow)"
  />

  <!-- G -->
  <path
    d="M48 24.5c-1.5-1.7-3.7-2.7-6.1-2.7-4.2 0-7.1 3.2-7.1 9.2s2.9 9.2 7.4 9.2c1.6 0 2.9-.4 3.8-1.1v-3.5h-4v-5h10v11.7c-2.8 2.1-6.2 3.2-10.1 3.2-8 0-13.2-5.5-13.2-14.5S33.2 17 41.5 17c4.5 0 8.1 1.5 10.6 4.3l-4.1 3.2Z"
    fill="url(#tg)"
    filter="url(#glow)"
  />

  <!-- Cyan accent -->
  <circle
    cx="51"
    cy="12"
    r="3"
    fill="#22D3EE"
  />
</svg>
