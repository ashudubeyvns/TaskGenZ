spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  application:
    name: taskgenz-api

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/taskgenz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:ashutoshdubey}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/taskgenz}

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-taskgenz-secret-key-to-a-long-random-value-2026}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}